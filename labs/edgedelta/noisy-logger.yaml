# UC1 seed: application logs so Pattern Anomaly can leave No Data.
# Namespace: ed-lab. Tiny CPU/RAM for the WSL k3d node.
apiVersion: v1
kind: Namespace
metadata:
  name: ed-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noisy-logger
  namespace: ed-lab
  labels:
    app: noisy-logger
    urca.uc: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: noisy-logger
  template:
    metadata:
      labels:
        app: noisy-logger
        urca.uc: "1"
    spec:
      containers:
        - name: logger
          image: busybox:1.36
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while true; do
                i=$((i+1))
                ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                echo "{\"ts\":\"$ts\",\"service\":\"checkout-api\",\"level\":\"INFO\",\"msg\":\"handled request\",\"n\":$i}"
                if [ $((i % 7)) -eq 0 ]; then
                  echo "{\"ts\":\"$ts\",\"service\":\"checkout-api\",\"level\":\"WARN\",\"msg\":\"upstream slow\",\"latency_ms\":$((800+i%200))}"
                fi
                if [ $((i % 11)) -eq 0 ]; then
                  echo "{\"ts\":\"$ts\",\"service\":\"checkout-api\",\"level\":\"ERROR\",\"msg\":\"payment_auth failed\",\"err\":\"timeout talking to payments\",\"n\":$i}"
                fi
                # UC1: new negative tokens on an existing service so Pattern Anomaly
                # has a 4h baseline to compare against (new workload groups stay No Data).
                echo "ERROR payment refused timeout failed checkout spike n=$i"
                echo "ERROR inventory lookup failed refused timeout spike n=$i"
                echo "ERROR cart checkout declined failed timeout spike n=$i"
                sleep 0.2
              done
