[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rvc"
version = "0.1.0"
description = "RCA Visual Compiler — Text-to-Simulation-to-Manim Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pytest>=7.4.0",
]

[project.scripts]
rvc = "run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "manim: requires manim CLI and ffmpeg for render integration",
]
