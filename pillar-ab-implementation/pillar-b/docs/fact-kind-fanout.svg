<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="fk-title fk-desc">
  <title id="fk-title">Post-E2 ingest.v1 fan-out by fact_kind</title>
  <desc id="fk-desc">One shared post-Identity ingest.v1 stream splits by fact_kind: metric_sample to SketchWriter and history sketches; topo_update to GraphWriter and map snapshot; event, anomaly, and trace_span skipped by both pillars for later stages.</desc>
  <defs>
    <marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="fk-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a96a3"/>
    </marker>
    <filter id="fk-shadow" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#1a2332" flood-opacity="0.11"/>
    </filter>
    <linearGradient id="fk-stream-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f9"/>
      <stop offset="100%" stop-color="#e4ecf4"/>
    </linearGradient>
    <style type="text/css"><![CDATA[
      .fk-bg { fill: #f8fafb; }
      .fk-stream { fill: url(#fk-stream-bg); stroke: #3d5a80; stroke-width: 1.75; }
      .fk-kind-a { fill: #e8f1fb; stroke: #3d6ea8; stroke-width: 1.5; }
      .fk-kind-b { fill: #e8f4f1; stroke: #2a7a6a; stroke-width: 1.75; }
      .fk-kind-skip { fill: #f4f5f7; stroke: #8a96a3; stroke-width: 1.35; stroke-dasharray: 5 3; }
      .fk-writer-a { fill: #dceaf8; stroke: #2f5f96; stroke-width: 1.5; }
      .fk-writer-b { fill: #d5ebe4; stroke: #1f6b5c; stroke-width: 1.75; }
      .fk-writer-skip { fill: #eceef1; stroke: #7a8694; stroke-width: 1.35; }
      .fk-dest { fill: #ffffff; stroke: #5a6a7a; stroke-width: 1.25; }
      .fk-title { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; font-weight: 500; fill: #1a2332; text-anchor: middle; }
      .fk-sub { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 11.5px; fill: #4a5568; text-anchor: middle; }
      .fk-mono { font-family: "IBM Plex Mono", "Consolas", ui-monospace, monospace; font-size: 12.5px; font-weight: 500; fill: #1a2332; text-anchor: middle; }
      .fk-mono-sm { font-family: "IBM Plex Mono", "Consolas", ui-monospace, monospace; font-size: 11px; fill: #2d3a4a; text-anchor: middle; }
      .fk-chip { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 10.5px; fill: #5a6a7a; text-anchor: middle; }
      .fk-flow { stroke: #4a5568; stroke-width: 1.65; fill: none; marker-end: url(#fk-arrow); }
      .fk-flow-muted { stroke: #8a96a3; stroke-width: 1.4; fill: none; stroke-dasharray: 5 3.5; marker-end: url(#fk-arrow-muted); }
      .fk-bus { stroke: #3d5a80; stroke-width: 2; fill: none; }
      .fk-caption { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 11px; fill: #5a6a7a; text-anchor: start; }
    ]]></style>
  </defs>

  <rect class="fk-bg" width="960" height="420" rx="10"/>

  <rect class="fk-stream" x="200" y="28" width="560" height="58" rx="10" filter="url(#fk-shadow)"/>
  <text class="fk-title" x="480" y="52">post-E2 ingest.v1 stream</text>
  <text class="fk-sub" x="480" y="72">one wire &#183; Identity stamped &#183; writers filter by fact_kind</text>

  <path class="fk-bus" d="M 480 86 V 118"/>
  <path class="fk-bus" d="M 160 118 H 800"/>
  <path class="fk-flow" d="M 160 118 V 148"/>
  <path class="fk-flow" d="M 480 118 V 148"/>
  <path class="fk-flow-muted" d="M 800 118 V 148"/>

  <rect class="fk-kind-a" x="48" y="148" width="224" height="72" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono" x="160" y="176">metric_sample</text>
  <text class="fk-chip" x="160" y="196">measurement</text>
  <text class="fk-sub" x="160" y="212">numeric sample for Stores / Detect</text>

  <path class="fk-flow" d="M 160 220 V 248"/>

  <rect class="fk-writer-a" x="48" y="248" width="224" height="56" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-title" x="160" y="272" style="font-size:14px">SketchWriter (A)</text>
  <text class="fk-sub" x="160" y="290">admits &#183; Pillar A</text>

  <path class="fk-flow" d="M 160 304 V 332"/>

  <rect class="fk-dest" x="48" y="332" width="224" height="52" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono-sm" x="160" y="354">history/</text>
  <text class="fk-sub" x="160" y="372">sketch.v1 windows</text>

  <rect class="fk-kind-b" x="368" y="148" width="224" height="72" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono" x="480" y="176">topo_update</text>
  <text class="fk-chip" x="480" y="196">edge fact</text>
  <text class="fk-sub" x="480" y="212">relation &#183; src_ci_id &#183; dst_ci_id</text>

  <path class="fk-flow" d="M 480 220 V 248"/>

  <rect class="fk-writer-b" x="368" y="248" width="224" height="56" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-title" x="480" y="272" style="font-size:14px">GraphWriter (B)</text>
  <text class="fk-sub" x="480" y="290">admits &#183; Pillar B</text>

  <path class="fk-flow" d="M 480 304 V 332"/>

  <rect class="fk-dest" x="368" y="332" width="224" height="52" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono-sm" x="480" y="354">map/</text>
  <text class="fk-sub" x="480" y="372">GraphSnapshot &#183; nodes/edges</text>

  <rect class="fk-kind-skip" x="688" y="148" width="224" height="72" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono" x="800" y="172" style="font-size:11.5px">event &#183; anomaly &#183; trace_span</text>
  <text class="fk-chip" x="800" y="192">discrete / span lines</text>
  <text class="fk-sub" x="800" y="210">logs land as event</text>

  <path class="fk-flow-muted" d="M 800 220 V 248"/>

  <rect class="fk-writer-skip" x="688" y="248" width="224" height="56" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-title" x="800" y="272" style="font-size:13.5px">both pillars skip</text>
  <text class="fk-sub" x="800" y="290">NOOP for A and B</text>

  <path class="fk-flow-muted" d="M 800 304 V 332"/>

  <rect class="fk-dest" x="688" y="332" width="224" height="52" rx="9" filter="url(#fk-shadow)"/>
  <text class="fk-mono-sm" x="800" y="354">E6-E10 later</text>
  <text class="fk-sub" x="800" y="372">Detect &#183; Localize &#183; Identify</text>

  <text class="fk-caption" x="48" y="408">Collect/adapters stamp fact_kind &#183; GraphWriter never guesses &#183; other kinds may later emit a separate topo_update upstream</text>
</svg>
