[package]
name = "map_vortex"
version = "0.1.0"
edition = "2024"
description = "Motadata map/ columnar tables (map_nodes + map_edges) → Arrow + Vortex"
license = "Apache-2.0"
publish = false

[[bin]]
name = "map_vortex_demo"
path = "src/bin/map_vortex_demo.rs"

[[bin]]
name = "map_vortex_cold"
path = "src/bin/map_vortex_cold.rs"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "59.3.0", features = ["ipc", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs"] }
vortex = { version = "0.86.1", features = ["tokio"] }
