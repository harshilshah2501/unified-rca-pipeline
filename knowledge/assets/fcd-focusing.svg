  <circle cx="920" cy="270" r="78" fill="none" stroke="#E8B86D" stroke-width="1" opacity="0.25"/>
  <circle cx="920" cy="270" r="52" fill="none" stroke="#E8B86D" stroke-width="1.4" opacity="0.4"/>
  <circle cx="920" cy="270" r="28" fill="none" stroke="#F0B35A" stroke-width="1.8" opacity="0.7"/>

  <circle cx="920" cy="270" r="36" fill="url(#leafGlow)"/>
  <circle cx="920" cy="270" r="11" fill="#0c121a" stroke="#F0B35A" stroke-width="2.2"/>
  <circle cx="920" cy="270" r="4" fill="#F0B35A"/>

