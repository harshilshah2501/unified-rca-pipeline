<!-- funnel silhouette hint from fabric into case -->
<path d="M360,190 L420,240 L420,290 L360,350 Z" fill="url(#fabricGlow)" opacity="0.5"/>

<!-- ========== ZONE T : TRIAGE (storm → seed) ========== -->
<rect x="400" y="130" width="300" height="300" rx="18" fill="#7BA8F5" opacity="0.05"/>
<text class="m" x="420" y="158" fill="#7BA8F5" font-size="13" font-weight="700">T · TRIAGE</text>
<text class="t" x="420" y="178" fill="#6f7f8c" font-size="11">episodic · storm → one seed</text>

  <line x1="430" y1="210" x2="620" y2="270" stroke="#7BA8F5" stroke-width="1" opacity="0.28"/>
