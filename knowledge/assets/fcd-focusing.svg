  <text class="m" x="510" y="400" fill="#8aa0c0" font-size="10">Curate</text>
  <text class="m" x="590" y="400" fill="#8aa0c0" font-size="10">Tailor</text>
  <!-- arcs suggesting merge -->
  <path d="M430,395 Q520,375 650,290" fill="none" stroke="#7BA8F5" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.5"/>

