  <text class="m" x="780" y="236" fill="#b8a080" font-size="10">Localize</text>
  <text class="m" x="840" y="236" fill="#b8a080" font-size="10">Identify</text>
  <text class="m" x="900" y="236" fill="#b8a080" font-size="10">Package</text>

  <!-- bottom mantra -->
  <line x1="40" y1="460" x2="1060" y2="460" stroke="#243040"/>
  <text class="t" x="40" y="490" fill="#c5d0da" font-size="15" font-weight="500">Wide fabric writes continuously.</text>
  <text class="t" x="40" y="514" fill="#c5d0da" font-size="15" font-weight="500">Triage collapses signals to one seed.</text>
  <text class="t" x="40" y="538" fill="#c5d0da" font-size="15" font-weight="500">Diagnose focuses that seed onto the leaf — then packages the verdict.</text>

  <!-- tiny IPO legend as rhythm, not a table -->
  <g transform="translate(780,488)">
    <circle cx="0" cy="0" r="5" fill="#7BA8F5"/><text class="m" x="12" y="4" fill="#8a96a4" font-size="10">in</text>
    <circle cx="48" cy="0" r="5" fill="#E8B86D"/><text class="m" x="60" y="4" fill="#8a96a4" font-size="10">transform</text>
    <circle cx="128" cy="0" r="5" fill="#7aecc4"/><text class="m" x="140" y="4" fill="#8a96a4" font-size="10">out</text>
