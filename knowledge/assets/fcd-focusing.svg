<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" role="img"
     aria-labelledby="title desc">
<title id="title">F → T → D — focusing the estate</title>
<desc id="desc">Conceptual workflow: continuous fabric narrows through triage into a diagnosed leaf.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0b1218"/>
    <stop offset="45%" stop-color="#0f1620"/>
    <stop offset="100%" stop-color="#0a1016"/>
  </linearGradient>
  <linearGradient id="fabricGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3d9a8b" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#3d9a8b" stop-opacity="0.05"/>
  </linearGradient>
  <linearGradient id="caseGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7BA8F5" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#7BA8F5" stop-opacity="0.08"/>
  </linearGradient>
  <radialGradient id="seedGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7BA8F5" stop-opacity="0.9"/>
    <stop offset="55%" stop-color="#7BA8F5" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#7BA8F5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="leafGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F0B35A" stop-opacity="1"/>
    <stop offset="40%" stop-color="#E8B86D" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#E8B86D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7BA8F5" stop-opacity="0.5"/>
    <stop offset="70%" stop-color="#E8B86D" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#F0B35A" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="vol" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F0B35A"/>
    <stop offset="50%" stop-color="#7BA8F5"/>
    <stop offset="100%" stop-color="#7aecc4"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <style>
    .t{font-family:IBM Plex Sans,system-ui,sans-serif}
    .m{font-family:IBM Plex Mono,ui-monospace,monospace}
  </style>
</defs>

<rect width="1100" height="560" rx="16" fill="url(#sky)" stroke="#243040"/>

<!-- eyebrow -->
<text class="m" x="40" y="36" fill="#7a8796" font-size="11" letter-spacing="2.2" font-weight="600">CONCEPT · THE FOCUSING</text>
<text class="t" x="40" y="68" fill="#eef3f8" font-size="28" font-weight="650">Estate → Seed → Leaf</text>
<text class="t" x="40" y="94" fill="#8f9bab" font-size="14">Volatility falls as attention narrows · F fabric · T triage · D diagnose</text>

<!-- volatility whisper -->
<rect x="820" y="48" width="240" height="6" rx="3" fill="url(#vol)" opacity="0.85"/>
<text class="m" x="820" y="72" fill="#F0B35A" font-size="10">HIGH</text>
<text class="m" x="920" y="72" fill="#9bb8f5" font-size="10">MED</text>
<text class="m" x="1025" y="72" fill="#7aecc4" font-size="10" text-anchor="end">LOW</text>

<!-- ========== ZONE F : FABRIC (wide river of parallel flows) ========== -->
<!-- soft wash -->
<rect x="36" y="130" width="340" height="300" rx="18" fill="#3d9a8b" opacity="0.06"/>
<text class="m" x="56" y="158" fill="#3d9a8b" font-size="13" font-weight="700">F · FABRIC</text>
<text class="t" x="56" y="178" fill="#6f7f8c" font-size="11">always-on · high churn</text>

<!-- five parallel flow ribbons = 5 stages -->

