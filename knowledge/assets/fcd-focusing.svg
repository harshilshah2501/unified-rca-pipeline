        fill="none" stroke="#5bc0ad" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="56" cy="268" r="4.5" fill="#5bc0ad"/>
  <text class="m" x="68" y="272" fill="#a8b8c4" font-size="10">Topology</text>

  <path d="M56,308 C140,302 220,316 300,308 S360,304 390,260"
        fill="none" stroke="#3d9a8b" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="56" cy="308" r="4.5" fill="#3d9a8b"/>
  <text class="m" x="68" y="312" fill="#a8b8c4" font-size="10">Fan-out</text>

  <path d="M56,348 C140,342 220,356 300,348 S360,344 390,260"
        fill="none" stroke="#2f8a7c" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
  <circle cx="56" cy="348" r="4.5" fill="#2f8a7c"/>
  <text class="m" x="68" y="352" fill="#a8b8c4" font-size="10">Maintain</text>
