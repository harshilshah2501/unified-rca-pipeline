# Datadog RCA lab — same topology as dynatrace-rca-lab:
#   frontend (8080) → product (8081) → inventory (8082)
# Traces go to host Datadog Agent (DD_AGENT_HOST / :8126).

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dd-frontend
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      PRODUCT_URL: http://product:8081
      FAULT_DIR: /faults
      DD_SERVICE: frontend
      DD_ENV: rca-lab
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: host.docker.internal
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./faults:/faults
      - ./frontend/app.py:/app/app.py:ro
    depends_on:
      - product

  product:
    build:
      context: .
      dockerfile: product/Dockerfile
    container_name: dd-product
    ports:
      - "18081:8081"
    environment:
      PORT: "8081"
      INVENTORY_URL: http://inventory:8082
      FAULT_DIR: /faults
      DD_SERVICE: product
      DD_ENV: rca-lab
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: host.docker.internal
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./faults:/faults
      - ./product/app.py:/app/app.py:ro
    depends_on:
      - inventory

  inventory:
    build:
      context: .
      dockerfile: inventory/Dockerfile
    container_name: dd-inventory
    ports:
      - "18082:8082"
    environment:
      PORT: "8082"
      FAULT_DIR: /faults
      DD_SERVICE: inventory
      DD_ENV: rca-lab
      DD_VERSION: "1.0.0"
      DD_AGENT_HOST: host.docker.internal
      DD_TRACE_AGENT_PORT: "8126"
      DD_LOGS_INJECTION: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./faults:/faults
      - ./inventory/app.py:/app/app.py:ro
