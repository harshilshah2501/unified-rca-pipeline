[pytest]
pythonpath = .
testpaths = ab_shared sketch
norecursedirs = .venv out sample_estate
addopts = -q
# Host Datadog APM injects ddtrace before pytest starts; ignore harmless assert-rewrite noise.
filterwarnings =
    ignore:Module already imported so cannot be rewritten; ddtrace:pytest.PytestAssertRewriteWarning
