<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340">
  <rect width="1120" height="340" fill="#ffffff"/>
  <text x="560" y="24" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" fill="#111827">Hubby + balanced — fair reverse-serve compare: hash_bi vs csr_csc (Reports 09 / 10)</text>
  <rect x="300" y="38" width="12" height="12" rx="2" fill="#6B7280"/>
  <text x="318" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#374151">hash_bi (bidirectional hash)</text>
  <rect x="560" y="38" width="12" height="12" rx="2" fill="#0F766E"/>
  <text x="578" y="48" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#374151">csr_csc (packed forward+reverse)</text>

  <!-- Panel 1: Build -->
  <text x="195" y="78" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#111827">Build time (ms)</text>
  <line x1="55" y1="90" x2="55" y2="250" stroke="#D1D5DB"/>
  <line x1="55" y1="250" x2="335" y2="250" stroke="#D1D5DB"/>
  <!-- y_max ~12200 -->
  <!-- 500k: 309, 450 -->
  <rect x="78" y="246.0" width="28" height="4.0" rx="2" fill="#6B7280"/>
  <text x="92" y="242" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">309</text>
  <rect x="110" y="244.1" width="28" height="5.9" rx="2" fill="#0F766E"/>
  <text x="124" y="240" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">450</text>
  <text x="108" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">500k edges</text>
  <!-- 1M: 924, 1357 -->
  <rect x="168" y="237.9" width="28" height="12.1" rx="2" fill="#6B7280"/>
  <text x="182" y="234" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">924</text>
  <rect x="200" y="232.2" width="28" height="17.8" rx="2" fill="#0F766E"/>
  <text x="214" y="228" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">1,357</text>
  <text x="198" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">1M edges</text>
  <!-- 5M: 6876, 10578 -->
  <rect x="258" y="160.0" width="28" height="90.0" rx="2" fill="#6B7280"/>
  <text x="272" y="156" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">6,876</text>
  <rect x="290" y="111.5" width="28" height="138.5" rx="2" fill="#0F766E"/>
  <text x="304" y="108" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">10,578</text>
  <text x="288" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">5M edges</text>
  <text x="20" y="175" transform="rotate(-90 20 175)" font-size="9" fill="#6B7280" font-family="Segoe UI, Inter, sans-serif">ms</text>

  <!-- Panel 2: Reverse -->
  <text x="560" y="78" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#111827">Reverse p95 (ms)</text>
  <line x1="420" y1="90" x2="420" y2="250" stroke="#D1D5DB"/>
  <line x1="420" y1="250" x2="700" y2="250" stroke="#D1D5DB"/>
  <!-- y_max 0.09; plot_h 160 -->
  <!-- 500k: 0.038, 0.043 -->
  <rect x="443" y="182.4" width="28" height="67.6" rx="2" fill="#6B7280"/>
  <text x="457" y="178" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.038</text>
  <rect x="475" y="173.6" width="28" height="76.4" rx="2" fill="#0F766E"/>
  <text x="489" y="170" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.043</text>
  <text x="473" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">500k edges</text>
  <!-- 1M: 0.057, 0.063 -->
  <rect x="533" y="148.7" width="28" height="101.3" rx="2" fill="#6B7280"/>
  <text x="547" y="145" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.057</text>
  <rect x="565" y="138.0" width="28" height="112.0" rx="2" fill="#0F766E"/>
  <text x="579" y="134" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.063</text>
  <text x="563" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">1M edges</text>
  <!-- 5M: 0.051, 0.030 -->
  <rect x="623" y="159.3" width="28" height="90.7" rx="2" fill="#6B7280"/>
  <text x="637" y="155" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.051</text>
  <rect x="655" y="196.7" width="28" height="53.3" rx="2" fill="#0F766E"/>
  <text x="669" y="193" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">0.030</text>
  <text x="653" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">5M edges</text>
  <text x="385" y="175" transform="rotate(-90 385 175)" font-size="9" fill="#6B7280" font-family="Segoe UI, Inter, sans-serif">ms</text>

  <!-- Panel 3: Retained -->
  <text x="925" y="78" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#111827">Retained index (MB, est.)</text>
  <line x1="785" y1="90" x2="785" y2="250" stroke="#D1D5DB"/>
  <line x1="785" y1="250" x2="1065" y2="250" stroke="#D1D5DB"/>
  <!-- y_max ~1300 -->
  <!-- 500k: 111, 48 -->
  <rect x="808" y="236.4" width="28" height="13.6" rx="2" fill="#6B7280"/>
  <text x="822" y="233" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">111 MB</text>
  <rect x="840" y="244.1" width="28" height="5.9" rx="2" fill="#0F766E"/>
  <text x="854" y="241" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">48 MB</text>
  <text x="838" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">500k edges</text>
  <!-- 1M: 225, 96 -->
  <rect x="898" y="222.3" width="28" height="27.7" rx="2" fill="#6B7280"/>
  <text x="912" y="219" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">225 MB</text>
  <rect x="930" y="238.2" width="28" height="11.8" rx="2" fill="#0F766E"/>
  <text x="944" y="235" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">96 MB</text>
  <text x="928" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">1M edges</text>
  <!-- 5M: 1127, 510 -->
  <rect x="988" y="111.4" width="28" height="138.6" rx="2" fill="#6B7280"/>
  <text x="1002" y="108" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">1.1 GB</text>
  <rect x="1020" y="187.3" width="28" height="62.7" rx="2" fill="#0F766E"/>
  <text x="1034" y="184" text-anchor="middle" font-size="8" fill="#374151" font-family="Segoe UI, Inter, sans-serif">510 MB</text>
  <text x="1018" y="266" text-anchor="middle" font-size="9" fill="#374151" font-family="Segoe UI, Inter, sans-serif">5M edges</text>
  <text x="750" y="175" transform="rotate(-90 750 175)" font-size="9" fill="#6B7280" font-family="Segoe UI, Inter, sans-serif">MB</text>

  <text x="560" y="300" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#374151">hash_bi wins the first panel; reverse is comparable (both sub-ms). csr_csc wins the third (~½ the retained index).</text>
  <text x="560" y="318" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#6B7280">Figure: fair opponent when reverse matters is hash_bi — not forward-only hash (recovery-speed reference only).</text>
</svg>
